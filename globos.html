<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego Scratch a Pantalla Completa</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #000;
      overflow: hidden;
    }

    .game-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Botón flotante para pantalla completa */
    #fullscreen-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 1000;
      border: none;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s ease;
    }

    #fullscreen-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="game-container">
    <button id="fullscreen-btn" class="btn btn-dark btn-sm">Pantalla Completa</button>

    <iframe 
      id="scratch-game"
      src="https://scratch.mit.edu/projects/1228220579/embed"
      allowtransparency="true"
      scrolling="no"
      allowfullscreen>
    </iframe>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
